# Déploiement Heroku de Weave, en conteneur.
#
# Cette voie reste disponible pour qui préfère maîtriser l'image exécutée. La
# voie ordinaire est désormais le buildpack officiel `heroku/nodejs`, qui ne
# demande aucun fichier : voir `Procfile` et `docs/DEPLOIEMENT.md`.

build:
  docker:
    web: Dockerfile

# La phase de publication tourne AVANT que le nouveau conteneur ne reçoive du
# trafic. Si les migrations échouent, la version précédente reste en ligne.
release:
  image: web
  command:
    - bash scripts/heroku-release.sh

run:
  web: node apps/api/src/index.ts
