<!doctype html>
<meta charset="utf-8" />
<!--
  L'icône, en grand, pour le rendu en PNG.

  Le SVG du favicon est dessiné dans une boîte de 32 : agrandi tel quel à 180,
  ses traits deviennent épais et ses arrondis mous. Celui-ci reprend le même
  motif — trois chaînes, deux trames — redessiné aux proportions de l'écran
  d'accueil, où l'icône fait presque un centimètre de côté.

  iOS n'applique pas la transparence ni les coins arrondis d'un
  `apple-touch-icon` : il pose l'image telle quelle et arrondit lui-même. Le
  fond est donc plein jusqu'au bord, sans rayon — un rayon dessiné ici
  laisserait quatre coins sombres autour de l'arrondi du système.
-->
<style>
  @page {
    margin: 0;
  }
  * {
    margin: 0;
  }
  body {
    width: 180px;
    height: 180px;
    background: #16121f;
  }
  svg {
    display: block;
  }
</style>
