<!doctype html>
<!--
  Le point d'entrée du bundler, et rien de plus.

  Ce fichier portait la tête complète de la page d'accueil : titre,
  description, balises de partage, données structurées — en français, et une
  seule fois. Il y a maintenant trois accueils — « / », « /en/ » et « /es/ » —
  et les trois s'indexent séparément. Une tête française sur la page anglaise
  la ferait indexer comme française.

  La construction écrit donc la tête des trois pages elle-même, à partir de
  `src/pages/metadonnees.ts`, et remplace ce fichier dans `dist`. Il ne reste
  ici que ce dont le bundler a besoin pour trouver le script, la feuille de
  style (importée par `main.tsx`) et l'icône.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Weave</title>
    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="racine"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
