name: iOS — envoyer à TestFlight

# Construit l'application iPhone, la Live Activity et l'application montre sur
# un exécuteur macOS de GitHub, puis les envoie à TestFlight.
#
# C'est ce qui permet de publier SANS POSSÉDER DE MAC : la machine de
# construction est fournie par GitHub, et tout se déclenche depuis le
# navigateur d'un téléphone.
#
# Prérequis (voir docs/DEPLOIEMENT.md) :
#   secrets   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT, ASC_TEAM_ID,
#             MATCH_PASSWORD, MATCH_GIT_TOKEN
#   variable  MATCH_GIT_URL
#
# Sans eux, le workflow s'arrête proprement en expliquant ce qui manque.

on:
  workflow_dispatch:
    inputs:
      creer_certificats:
        description: "Première exécution : autoriser la création des certificats"
        type: boolean
        default: false
  push:
    tags: ["ios-v*"]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Construire et envoyer
    runs-on: macos-15
    timeout-minutes: 60

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_TOKEN }}
      MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
      MATCH_READONLY: ${{ inputs.creer_certificats && 'false' || 'true' }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"

    steps:
      - name: Vérifier la configuration
        id: verifier
        run: |
          manque=""
          for nom in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT ASC_TEAM_ID MATCH_PASSWORD MATCH_GIT_URL; do
            if [ -z "${!nom}" ]; then manque="$manque $nom"; fi
          done

          if [ -n "$manque" ]; then
            {
              echo "## Publication iOS non configurée"
              echo ""
              echo "Valeurs manquantes :$manque"
              echo ""
              echo "La marche à suivre, étape par étape, est dans \`docs/DEPLOIEMENT.md\`."
              echo "Elle demande un compte Apple Developer, et se fait entièrement"
              echo "depuis un navigateur de téléphone."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Publication ignorée : configuration Apple absente."
            echo "pret=false" >> "$GITHUB_OUTPUT"
          else
            echo "pret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer le dépôt
        if: steps.verifier.outputs.pret == 'true'
        uses: actions/checkout@v5

      - name: Choisir la version de Xcode
        if: steps.verifier.outputs.pret == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Installer XcodeGen et fastlane
        if: steps.verifier.outputs.pret == 'true'
        run: |
          brew install xcodegen
          cd apps/ios && bundle install --quiet

      - name: Tests du paquet WeaveKit
        if: steps.verifier.outputs.pret == 'true'
        # Les tests passent avant la construction : inutile de signer et
        # d'envoyer une version dont le cœur est cassé.
        run: cd apps/ios/WeaveKit && swift test

      - name: Construire et envoyer à TestFlight
        if: steps.verifier.outputs.pret == 'true'
        working-directory: apps/ios
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          CHANGELOG: ${{ github.event.head_commit.message || 'Version interne.' }}
          WEAVE_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: bundle exec fastlane beta

      - name: Conserver les journaux en cas d'échec
        if: failure() && steps.verifier.outputs.pret == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: journaux-xcode
          path: |
            ~/Library/Logs/gym
            apps/ios/fastlane/report.xml
          retention-days: 7
          if-no-files-found: ignore
