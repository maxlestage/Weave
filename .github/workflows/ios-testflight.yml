name: iOS — envoyer à TestFlight

# Construit l'application iPhone, la Live Activity et l'application montre sur
# un exécuteur macOS de GitHub, puis les envoie à TestFlight.
#
# C'est ce qui permet de publier SANS POSSÉDER DE MAC : la machine de
# construction est fournie par GitHub, et tout se déclenche depuis le
# navigateur d'un téléphone.
#
# Prérequis (voir docs/DEPLOIEMENT.md) :
#   secrets   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT
#             (ASC_TEAM_ID facultatif : il se lit sur les identifiants)
#   une clé d'API de rôle Admin : la signature est entièrement automatique
#
# La première exécution enregistre les identifiants chez Apple, puis s'arrête
# en demandant de créer l'application dans App Store Connect — le seul geste
# qu'Apple ne permet pas d'automatiser.
#
# Sans eux, le workflow s'arrête proprement en expliquant ce qui manque.

on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Construire et envoyer
    runs-on: macos-15
    timeout-minutes: 60

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # Deux noms acceptés pour chacun : ceux de la documentation, et ceux
      # sous lesquels les secrets ont été déposés la première fois. Un nom
      # de secret mal deviné se lisait comme une valeur vide, et le workflow
      # disait la clé absente alors qu'elle était là.
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT || secrets.ASC_KEY_P8 }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID || secrets.APPLE_TEAM_ID }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"

    steps:
      - name: Vérifier la configuration
        id: verifier
        run: |
          manque=""
          for nom in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT; do
            if [ -z "${!nom}" ]; then manque="$manque $nom"; fi
          done

          if [ -n "$manque" ]; then
            {
              echo "## Publication iOS non configurée"
              echo ""
              echo "Valeurs manquantes :$manque"
              echo ""
              echo "La marche à suivre, étape par étape, est dans \`docs/DEPLOIEMENT.md\`."
              echo "Elle demande un compte Apple Developer, et se fait entièrement"
              echo "depuis un navigateur de téléphone."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Publication ignorée : configuration Apple absente."
            echo "pret=false" >> "$GITHUB_OUTPUT"
          else
            echo "pret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer le dépôt
        if: steps.verifier.outputs.pret == 'true'
        uses: actions/checkout@v5

      # ------------------------------------------------------------------
      # L'adresse de l'API, avant de construire quoi que ce soit.
      #
      # `project.yml` a longtemps porté « https://api.weave.app » en
      # configuration Release. C'est un domaine de remplacement, et le dépôt le
      # dit lui-même ailleurs :
      # « https://weave.app […] un domaine qui ne répond pas »
      # (apps/web/src/pages/identite.ts).
      #
      # Une version envoyée à TestFlight avec cette adresse s'installe, s'ouvre,
      # et échoue à CHAQUE appel réseau — sans rien qui relie la panne à sa
      # cause. Le site avait exactement ce défaut et sa construction le refuse
      # depuis ; la correction n'avait pas atteint l'application.
      #
      # Mieux vaut ne rien envoyer qu'envoyer cela.
      # ------------------------------------------------------------------
      - name: Vérifier l'adresse de l'API
        if: steps.verifier.outputs.pret == 'true'
        run: |
          adresse=$(sed -n 's/.*WEAVE_API_URL: *//p' apps/ios/project.yml \
            | sed 's/$()//g' | tail -1 | tr -d ' ')
          echo "Adresse Release : $adresse"

          refuser() {
            {
              echo "## Envoi interrompu : l'adresse de l'API"
              echo ""
              echo "\`WEAVE_API_URL\` vaut \`$adresse\` en configuration Release."
              echo ""
              echo "$1"
              echo ""
              echo "Renseignez votre domaine dans \`apps/ios/project.yml\`,"
              echo "section \`configs.Release\`, puis relancez."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$1"
            exit 1
          }

          case "$adresse" in
            *weave.app*)
              refuser "C'est le domaine de remplacement du dépôt, et il ne répond pas. L'application s'installerait et échouerait à chaque appel réseau." ;;
            https://*)
              echo "::notice::Adresse de l'API : $adresse" ;;
            *)
              refuser "Ce n'est pas une adresse https. Une application de l'App Store ne peut pas appeler une adresse en clair." ;;
          esac

      - name: Choisir la version de Xcode
        if: steps.verifier.outputs.pret == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Installer XcodeGen et fastlane
        if: steps.verifier.outputs.pret == 'true'
        run: |
          brew install xcodegen
          cd apps/ios && bundle install --quiet

      # Les tests passent avant la construction : inutile de signer et
      # d'envoyer une version dont le cœur est cassé.
      #
      # Sur un simulateur iPhone, et non `swift test` : sur un Mac, `swift
      # test` compile pour macOS, plateforme que WeaveKit ne déclare pas — la
      # compilation échouait (« 'now' is only available in macOS 12 »). C'est
      # la commande de « iOS — compiler », qui tourne à chaque poussée.
      - name: Tests du paquet WeaveKit
        if: steps.verifier.outputs.pret == 'true'
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodegen generate
          udid=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          appareils = json.load(sys.stdin)['devices']
          for moteur in sorted(appareils, reverse=True):
              if 'iOS' not in moteur:
                  continue
              for a in appareils[moteur]:
                  if a.get('isAvailable') and 'iPhone' in a['name']:
                      print(a['udid'])
                      raise SystemExit
          raise SystemExit('aucun simulateur iPhone disponible')
          ")
          echo "Simulateur : $udid"

          xcodebuild test \
            -project 'Weave ‣.xcodeproj' \
            -scheme 'Weave ‣' \
            -configuration Debug \
            -destination "id=$udid" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee /tmp/tests.log | grep -E "Test Case|Test Suite|passed|failed|error:" || true

          # `grep` masque le code de sortie de xcodebuild : on le relit.
          if grep -q "\*\* TEST FAILED \*\*" /tmp/tests.log; then
            echo "::error::Des tests ont échoué sur le simulateur."
            exit 1
          fi

      - name: Construire et envoyer à TestFlight
        if: steps.verifier.outputs.pret == 'true'
        working-directory: apps/ios
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          CHANGELOG: ${{ github.event.head_commit.message || 'Version interne.' }}
        run: bundle exec fastlane beta

      - name: Conserver les journaux en cas d'échec
        if: failure() && steps.verifier.outputs.pret == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: journaux-xcode
          path: |
            ~/Library/Logs/gym
            apps/ios/fastlane/report.xml
          retention-days: 7
          if-no-files-found: ignore
