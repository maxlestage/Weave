name: Intégration continue

on:
  push:
    branches: [master, "claude/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Types, tests et compilation
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Dériver le schéma SQLite
        run: npm run db:sqlite

      - name: Vérifier que les migrations suivent le schéma
        # Les migrations sont versionnées, le schéma aussi : si l'un a évolué
        # sans l'autre, la base de production divergera silencieusement.
        # `--exit-code` renvoie 2 quand une différence subsiste.
        working-directory: apps/api
        run: |
          WEAVE_DB=sqlite npx prisma migrate diff \
            --from-migrations prisma/migrations-sqlite \
            --to-schema prisma/schema.sqlite.prisma \
            --exit-code

      - name: Générer les clients Prisma
        run: npm run db:generate

      - name: Préparer la base de développement
        run: WEAVE_DB=sqlite npm run db:deploy

      - name: Jeu de données
        run: WEAVE_DB=sqlite npm run db:seed

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests
        run: WEAVE_DB=sqlite npm test

      - name: Compiler le site
        run: npm run build --workspace @weave/web

      - name: Formatage
        run: npx prettier --check .
