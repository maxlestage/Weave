name: Intégration continue

on:
  push:
    branches: [master, "claude/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Types, tests et compilation
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Vérification des types
        run: bun run typecheck

      - name: Compiler le site
        run: bun run --filter @weave/web build

      # ----------------------------------------------------------------
      # L'API, en Rust
      #
      # C'est ce binaire que le dyno exécute : sans ces trois étapes, rien ne
      # garderait ce qui tourne réellement en production.
      # ----------------------------------------------------------------
      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de compilation Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/api-rs/target
            apps/site/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/api-rs/Cargo.lock', 'apps/site/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Tests de l'API
        # Les tests d'intégration montent le service entier ; le quota de
        # demandes n'a d'autre source de vérité que le cache, d'où Redis.
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --manifest-path apps/api-rs/Cargo.toml

      - name: Compiler l'API
        run: cargo build --release --manifest-path apps/api-rs/Cargo.toml

      # ----------------------------------------------------------------
      # Le portage du site en Yew
      #
      # `apps/site` n'était pas vérifié ici du tout : la chaîne Rust du site se
      # compilait sur ma machine et nulle part ailleurs. Un outil qui compare
      # les deux rendus n'a pourtant d'intérêt que s'il tourne à chaque
      # poussée — une garde que personne ne lance n'en est pas une.
      #
      # La comparaison porte section par section. Celles que Yew ne rend pas
      # encore sont listées et non comptées comme des fautes : l'étape sert
      # pendant le portage, et pas seulement le jour où il finit.
      # ----------------------------------------------------------------
      - name: Le contrat engendré est-il à jour
        # Le fichier `src/contrat.rs` est engendré depuis `packages/contracts`.
        # Son en-tête annonce qu'« un test vérifie qu'il est à jour » — et
        # c'était faux : rien ne le vérifiait. Un prix changé dans le contrat
        # sans régénération ferait mentir le site, et c'est la seule chose que
        # cette garde sert à empêcher.
        run: bun run apps/site/outils/engendrer-contrat.ts --verifier

      - name: Rendre le site en Yew
        run: cargo run --manifest-path apps/site/Cargo.toml --features ssr --bin rendre

      - name: Tests de la chaîne de construction du site
        run: cargo test --manifest-path apps/site/Cargo.toml --features ssr

      - name: Les deux chaînes refusent-elles pareil
        # Ce que `build.ts` refuse de produire est la moitié de sa valeur : une
        # origine morte, une adresse non chiffrée, des mentions légales
        # incomplètes qui partiraient pour un vrai domaine. Une page jamais
        # écrite ne se compare pas — on compare donc le refus. C'est la seule
        # chose qui empêche une mise en ligne sans SIREN, et l'article 6-III de
        # la LCEN la rend obligatoire.
        #
        # L'étape laisse aussi les deux sorties propres pour la comparaison.
        run: bun run apps/site/outils/comparer-les-refus.ts

      - name: React et Yew rendent-ils la même chose
        run: bun run apps/site/outils/comparer.ts

      # ----------------------------------------------------------------
      # WeaveKit, en Swift
      #
      # Six mille lignes de Swift n'avaient jamais rencontré de compilateur :
      # Xcode était le seul endroit où ce code se construisait, et le dépôt n'a
      # pas de Mac. Deux erreurs y dormaient — un `deinit` non isolé dans une
      # classe `@MainActor`, deux formateurs de date partagés que le mode
      # Swift 6 refuse. Ni l'une ni l'autre ne tenait à iOS : ce sont des règles
      # du langage, et Linux les applique pareil.
      #
      # Ce qui dépend d'UIKit, de SwiftUI, d'ActivityKit ou de StoreKit porte
      # déjà sa propre garde et se vide ici. Reste le cœur : modèles, client
      # d'API, magasins d'état — la part que le serveur doit satisfaire, et
      # celle que les tests de WeaveKit exercent.
      # ----------------------------------------------------------------
      - name: Installer Swift
        # La version est celle que `WeaveKit/Package.swift` déclare
        # (swift-tools-version). Le mode Swift 6 y est demandé explicitement :
        # compiler avec une version plus ancienne ne dirait pas la même chose.
        run: |
          set -euo pipefail
          version=6.2.3
          . /etc/os-release           # VERSION_ID, p. ex. « 24.04 »
          compact="${VERSION_ID//./}" # l'adresse porte les deux écritures
          base="https://download.swift.org/swift-${version}-release"
          sudo mkdir -p /opt/swift
          curl -sSL --retry 3 \
            "${base}/ubuntu${compact}/swift-${version}-RELEASE/swift-${version}-RELEASE-ubuntu${VERSION_ID}.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /opt/swift
          echo /opt/swift/usr/bin >> "$GITHUB_PATH"

      - name: Compiler et tester WeaveKit
        run: ./apps/ios/verification-linux/verifier.sh

      - name: Formatage
        run: bunx --bun prettier --check .
