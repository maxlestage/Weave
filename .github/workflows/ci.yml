name: Intégration continue

on:
  push:
    branches: [master, "claude/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Types, tests et compilation
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Dériver le schéma SQLite
        run: bun run db:sqlite

      - name: Vérifier que les migrations suivent le schéma
        # Les migrations sont versionnées, le schéma aussi : si l'un a évolué
        # sans l'autre, la base de production divergera silencieusement.
        # `--exit-code` renvoie 2 quand une différence subsiste.
        working-directory: apps/api
        run: |
          WEAVE_DB=sqlite bunx prisma migrate diff \
            --from-migrations prisma/migrations-sqlite \
            --to-schema prisma/schema.sqlite.prisma \
            --exit-code

      - name: Générer les clients Prisma
        run: bun run db:generate

      - name: Préparer la base de développement
        run: WEAVE_DB=sqlite bun run db:deploy

      - name: Jeu de données
        run: WEAVE_DB=sqlite bun run db:seed

      - name: Vérification des types
        run: bun run typecheck

      - name: Tests
        run: WEAVE_DB=sqlite bun test

      - name: Compiler le site
        run: bun run --filter @weave/web build

      # ----------------------------------------------------------------
      # L'API, en Rust
      #
      # C'est ce binaire que le dyno exécute : sans ces trois étapes, rien ne
      # garderait ce qui tourne réellement en production.
      # ----------------------------------------------------------------
      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de compilation Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/api-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/api-rs/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Tests de l'API
        # Les tests d'intégration montent le service entier ; le quota de
        # demandes n'a d'autre source de vérité que le cache, d'où Redis.
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --manifest-path apps/api-rs/Cargo.toml

      - name: Compiler l'API
        run: cargo build --release --manifest-path apps/api-rs/Cargo.toml

      - name: Formatage
        run: bunx --bun prettier --check .
