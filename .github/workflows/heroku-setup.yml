name: Heroku — mettre en ligne

# Met Weave en ligne, d'un seul tenant : crée l'application, la configure
# correctement, et déploie. À lancer depuis l'onglet Actions de GitHub, bouton
# « Run workflow ». Rien d'autre n'est nécessaire — ni ordinateur, ni ligne de
# commande Heroku.
#
# UN SEUL PRÉREQUIS : le secret de dépôt `HEROKU_API_KEY`.
#   1. https://dashboard.heroku.com/account → section « API Key » → Reveal
#   2. GitHub → Settings → Secrets and variables → Actions → New repository
#      secret → nom `HEROKU_API_KEY`, valeur collée.
#
# Relançable sans risque : si l'application existe déjà, le workflow se
# contente de corriger ce qui doit l'être, puis redéploie.

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nom de l'application Heroku (minuscules, chiffres et tirets)"
        required: true
        type: string
      region:
        description: "Région"
        required: true
        default: eu
        type: choice
        options: [eu, us]

permissions:
  contents: read

jobs:
  mettre_en_ligne:
    name: Créer, configurer et déployer
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      APP: ${{ inputs.app_name }}
      ACCEPT: "application/vnd.heroku+json; version=3"

    steps:
      - name: Vérifier la clé d'API
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "::error::Le secret HEROKU_API_KEY est absent. Ajoutez-le dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          nom=$(curl -sS -H "Accept: $ACCEPT" -H "Authorization: Bearer $HEROKU_API_KEY" \
                https://api.heroku.com/account | python3 -c 'import sys,json; print(json.load(sys.stdin).get("email","?"))')
          echo "Connecté à Heroku en tant que $nom"

      - name: Créer l'application
        run: |
          reponse=$(curl -sS -w '\n%{http_code}' -X POST https://api.heroku.com/apps \
            -H "Accept: $ACCEPT" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$APP\",\"region\":\"${{ inputs.region }}\",\"stack\":\"container\"}")
          code=$(echo "$reponse" | tail -1)
          corps=$(echo "$reponse" | sed '$d')

          if [ "$code" = "201" ]; then
            echo "Application $APP créée."
          elif echo "$corps" | grep -q "already taken"; then
            echo "::warning::Le nom $APP est déjà pris. S'il s'agit de votre application, la suite se poursuit."
          else
            echo "::error::Création impossible (HTTP $code) : $corps"
            exit 1
          fi

      - name: État de l'application avant correction
        # Affiché d'abord : savoir d'où l'on part rend la suite lisible, et
        # c'est la seule façon de voir depuis un téléphone ce qu'Heroku a
        # réellement configuré.
        run: |
          curl -sS "https://api.heroku.com/apps/$APP" \
            -H "Accept: $ACCEPT" \
            -H "Authorization: Bearer $HEROKU_API_KEY" > /tmp/avant.json
          pile=$(python3 -c "import json;print(json.load(open('/tmp/avant.json')).get('build_stack',{}).get('name','inconnue'))")

          curl -sS "https://api.heroku.com/apps/$APP/buildpack-installations" \
            -H "Accept: $ACCEPT" \
            -H "Authorization: Bearer $HEROKU_API_KEY" > /tmp/bp.json
          bp=$(python3 -c "import json;d=json.load(open('/tmp/bp.json'));print(', '.join(b['buildpack']['name'] for b in d) if isinstance(d,list) and d else 'aucun')")

          echo "  pile        : $pile"
          echo "  buildpacks  : $bp"
          echo "PILE_AVANT=$pile" >> "$GITHUB_ENV"
          echo "BP_AVANT=$bp" >> "$GITHUB_ENV"

      - name: Forcer la pile « container »
        # Étape décisive. Sans elle, Heroku ignore heroku.yml, croit à une
        # application Node.js et lance `npm install` — qui échoue aussitôt,
        # `workspace:*` étant une syntaxe que seul Bun comprend.
        #
        # La réponse est relue : annoncer « container » sans vérifier laisserait
        # passer exactement le problème que cette étape doit empêcher.
        run: |
          curl -sS -X PATCH "https://api.heroku.com/apps/$APP" \
            -H "Accept: $ACCEPT" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"build_stack":"container"}' > /tmp/app.json

          pile=$(python3 -c "import json;print(json.load(open('/tmp/app.json')).get('build_stack',{}).get('name',''))")

          if [ "$pile" != "container" ]; then
            echo "::error::La pile de construction vaut « $pile » au lieu de « container »."
            echo "Réponse de l'API :"
            cat /tmp/app.json
            exit 1
          fi
          echo "Pile de construction : container"

      - name: Retirer les buildpacks
        # Sur la pile « container », les buildpacks ne servent plus à rien. Les
        # laisser en place entretient l'ambiguïté : le tableau de bord continue
        # d'afficher « Node.js », et un déploiement fait par un autre chemin
        # peut encore tenter de les utiliser.
        run: |
          reponse=$(curl -sS -w '\n%{http_code}' -X PUT \
            "https://api.heroku.com/apps/$APP/buildpack-installations" \
            -H "Accept: $ACCEPT" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"updates":[]}')
          code=$(echo "$reponse" | tail -1)

          if [ "$code" = "200" ]; then
            echo "Buildpacks retirés."
          else
            echo "::warning::Retrait des buildpacks impossible (HTTP $code). Sans conséquence sur la pile container, mais le tableau de bord continuera d'afficher un buildpack."
          fi

      - name: Brancher PostgreSQL et le magasin clé-valeur
        run: |
          ajouter() {
            reponse=$(curl -sS -w '\n%{http_code}' -X POST "https://api.heroku.com/apps/$APP/addons" \
              -H "Accept: $ACCEPT" \
              -H "Authorization: Bearer $HEROKU_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"plan\":\"$1\"}")
            code=$(echo "$reponse" | tail -1)
            corps=$(echo "$reponse" | sed '$d')
            if [ "$code" = "201" ] || [ "$code" = "202" ]; then
              echo "  $1 : ajouté"
            elif echo "$corps" | grep -qi "already"; then
              echo "  $1 : déjà présent"
            else
              echo "::error::Ajout de $1 impossible (HTTP $code) : $corps"
              exit 1
            fi
          }
          ajouter "heroku-postgresql:essential-0"
          ajouter "heroku-redis:mini"

      - name: Poser les secrets et la configuration
        run: |
          # Les secrets sont générés ici et ne transitent par aucun écran :
          # ils sont écrits directement dans la configuration Heroku.
          jwt=$(openssl rand -base64 48 | tr -d '\n')
          media=$(openssl rand -base64 48 | tr -d '\n')

          python3 - "$APP" "$jwt" "$media" <<'PY' > /tmp/config.json
          import json, sys
          app, jwt, media = sys.argv[1], sys.argv[2], sys.argv[3]
          print(json.dumps({
              "NODE_ENV": "production",
              "WEAVE_DB": "postgres",
              "JWT_SECRET": jwt,
              "MEDIA_SIGNING_SECRET": media,
              # Heroku présente des certificats auto-signés sur son réseau
              # interne : le trafic reste chiffré, l'identité du serveur n'est
              # pas vérifiée. Voir docs/DEPLOIEMENT.md.
              "DATABASE_SSL_INSECURE": "true",
              "REDIS_TLS_INSECURE": "true",
              "PUBLIC_WEB_ORIGIN": f"https://{app}.herokuapp.com",
              "MEDIA_BASE_URL": f"https://{app}.herokuapp.com/media",
              "APNS_BUNDLE_ID": "com.weave.app",
              "APNS_ENVIRONMENT": "sandbox",
              "APPSTORE_ENVIRONMENT": "sandbox",
          }))
          PY

          curl -sS -X PATCH "https://api.heroku.com/apps/$APP/config-vars" \
            -H "Accept: $ACCEPT" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/config.json > /dev/null
          echo "Configuration posée (secrets générés aléatoirement)."

      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          # Heroku refuse une poussée depuis un clone superficiel.
          fetch-depth: 0

      - name: Déployer
        run: |
          echo "Publication de $GITHUB_SHA vers $APP"
          git push --force \
            "https://heroku:$HEROKU_API_KEY@git.heroku.com/$APP.git" \
            "$GITHUB_SHA:refs/heads/master"

      - name: Vérifier que l'application répond
        id: sonde
        run: |
          adresse="https://$APP.herokuapp.com/health"
          echo "Sonde : $adresse"

          for tentative in $(seq 12); do
            corps=$(curl -sS --max-time 10 "$adresse" || true)
            if echo "$corps" | grep -q '"status":"ok"'; then
              echo "en_ligne=true" >> "$GITHUB_OUTPUT"
              echo "corps=$corps" >> "$GITHUB_OUTPUT"
              echo "Application en ligne."
              exit 0
            fi
            echo "  tentative $tentative : pas encore prête"
            sleep 10
          done

          echo "en_ligne=false" >> "$GITHUB_OUTPUT"
          echo "corps=$corps" >> "$GITHUB_OUTPUT"

      - name: Récapitulatif
        if: always()
        run: |
          {
            if [ "${{ steps.sonde.outputs.en_ligne }}" = "true" ]; then
              echo "## Weave est en ligne"
              echo ""
              echo "### https://$APP.herokuapp.com"
              echo ""
              echo "| | |"
              echo "| --- | --- |"
              echo "| Site vitrine | https://$APP.herokuapp.com |"
              echo "| Documentation de l'API | https://$APP.herokuapp.com/openapi |"
              echo "| Sonde de santé | https://$APP.herokuapp.com/health |"
            else
              echo "## Déployé, mais l'application ne répond pas encore"
              echo ""
              echo "La construction a réussi ; \`/health\` n'a pas répondu \`ok\`."
              echo "Regardez les journaux : tableau de bord Heroku → **More → View logs**."
            fi

            echo ""
            echo "### Ce qui a été corrigé"
            echo ""
            echo "| | Avant | Après |"
            echo "| --- | --- | --- |"
            echo "| Pile de construction | \`$PILE_AVANT\` | \`container\` |"
            echo "| Buildpacks | $BP_AVANT | aucun |"
            echo ""
            echo "### Pour déployer automatiquement à chaque fusion"
            echo ""
            echo "Ajoutez la variable de dépôt \`HEROKU_APP_NAME\` = \`$APP\`"
            echo "(Settings → Secrets and variables → Actions → onglet **Variables**)."
            echo ""
            echo "### Si le tableau de bord Heroku vous envoie des échecs"
            echo ""
            echo "Onglet *Deploy* → désactivez **Automatic deploys**. Ce chemin construit"
            echo "avec des buildpacks, ignore le \`Dockerfile\`, et échoue sur"
            echo "\`workspace:*\`. Il n'affecte pas ce workflow, mais il encombre vos"
            echo "notifications."
          } >> "$GITHUB_STEP_SUMMARY"
