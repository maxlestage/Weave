# Infrastructure locale : PostgreSQL et Redis, images officielles.
#
# Facultatif pour développer — l'API tourne aussi sur SQLite et un Redis local.
# Utile pour travailler dans les mêmes conditions qu'en production.

services:
  postgres:
    image: postgres:18-alpine
    container_name: weave-postgres
    environment:
      POSTGRES_USER: weave
      POSTGRES_PASSWORD: weave
      POSTGRES_DB: weave
      # Sans cela, l'initialisation utilise la locale du conteneur.
      LANG: fr_FR.utf8
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weave -d weave"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: weave-redis
    command:
      - redis-server
      - --save
      - "300"
      - "10"
      - --appendonly
      - "no"
      # Les fils portent tous un TTL : en cas de pression mémoire, on évince
      # d'abord ceux qui expirent le plus tôt, jamais une clé sans expiration.
      - --maxmemory-policy
      - volatile-ttl
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
